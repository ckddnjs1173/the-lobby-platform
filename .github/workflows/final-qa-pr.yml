name: Final QA Predeploy

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.example.invalid
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: the-lobby-platform
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci.example.invalid
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:ci
      GROQ_API_KEY: ci-placeholder
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Apply final QA patch
        run: python scripts/apply-final-qa-patch.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Frontend/backend contract gate
        run: npm run check:final:integration

      - name: Production readiness static gate
        run: npm run check:phase10:static

      - name: Dependency security gate
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build

      - name: Diff sanity
        run: git diff --check

      - name: Commit validated patch
        shell: bash
        run: |
          rm -f .github/workflows/final-qa-patch.yml .github/workflows/final-qa-pr.yml scripts/apply-final-qa-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No QA changes to commit"
            exit 0
          fi
          git commit -m "Release: final predeploy QA polish"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
