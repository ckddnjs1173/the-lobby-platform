name: One-shot jobs polish

on:
  push:
    branches:
      - ui/final-visual-system

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[jobs-polish-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/final-visual-system
          fetch-depth: 0

      - name: Patch sparse jobs layout
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/jobs/page.tsx')
          text = path.read_text()
          old = '''        ) : (\n          <div className="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">\n            {filteredJobs.map((job) => {'''
          new = '''        ) : (\n          <div\n            className={\n              filteredJobs.length === 1\n                ? "mx-auto grid w-full max-w-[860px] gap-5 lg:grid-cols-[minmax(0,1fr)_360px]"\n                : filteredJobs.length === 2\n                  ? "mx-auto grid w-full max-w-[1180px] gap-5 md:grid-cols-2 xl:grid-cols-3"\n                  : "grid gap-4 sm:grid-cols-2 xl:grid-cols-4"\n            }\n          >\n            {filteredJobs.map((job) => {'''
          if old not in text:
              raise SystemExit('TARGET_NOT_FOUND')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/one-shot-jobs-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/jobs/page.tsx .github/workflows/one-shot-jobs-polish.yml
          git commit -m "Polish sparse jobs layout [jobs-polish-done]"
          git push origin HEAD:ui/final-visual-system
