# Authenticated visual QA uses isolated ephemeral Firebase fixtures, responsive selectors, and cleanup after capture.
name: Authenticated Internal UI QA

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  authenticated-ui-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.FIREBASE_ADMIN_PROJECT_ID }}
      FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
      FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install isolated Chromium
        run: |
          npm install --prefix /tmp/the-lobby-playwright --no-package-lock playwright@1.55.0
          /tmp/the-lobby-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Start application
        shell: bash
        run: |
          npm start > /tmp/the-lobby-auth-ui.log 2>&1 &
          echo $! > /tmp/the-lobby-auth-ui.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              echo AUTH_UI_SERVER_READY
              exit 0
            fi
            sleep 1
          done
          cat /tmp/the-lobby-auth-ui.log
          exit 1
      - name: Instrument mobile overflow diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/authenticated-ui-qa.cjs')
          s = p.read_text()
          old = '''async function noHorizontalOverflow(page, label) {
            const metrics = await page.evaluate(() => ({ viewport: innerWidth, document: document.documentElement.scrollWidth, body: document.body.scrollWidth }));
            assert(metrics.document <= metrics.viewport + 2 && metrics.body <= metrics.viewport + 2, `${label}:HORIZONTAL_OVERFLOW:${JSON.stringify(metrics)}`);
          }'''
          new = '''async function noHorizontalOverflow(page, label) {
            const metrics = await page.evaluate(() => {
              const viewport = innerWidth;
              const offenders = Array.from(document.querySelectorAll("body *"))
                .map((el) => {
                  const rect = el.getBoundingClientRect();
                  return {
                    tag: el.tagName,
                    cls: typeof el.className === "string" ? el.className.slice(0, 240) : "",
                    text: (el.textContent || "").trim().replace(/\\s+/g, " ").slice(0, 100),
                    left: Math.round(rect.left),
                    right: Math.round(rect.right),
                    width: Math.round(rect.width),
                  };
                })
                .filter((item) => item.right > viewport + 2 || item.left < -2)
                .slice(0, 25);
              return { viewport, document: document.documentElement.scrollWidth, body: document.body.scrollWidth, offenders };
            });
            if (metrics.offenders.length) console.log(`${label}:OVERFLOW_OFFENDERS:${JSON.stringify(metrics.offenders)}`);
            assert(metrics.document <= metrics.viewport + 2 && metrics.body <= metrics.viewport + 2, `${label}:HORIZONTAL_OVERFLOW:${JSON.stringify(metrics)}`);
          }'''
          if old not in s:
              raise SystemExit('OVERFLOW_FUNCTION_TARGET_NOT_FOUND')
          s = s.replace(old, new, 1)
          old2 = '''  await noHorizontalOverflow(page, `${viewportName}:CANDIDATE`);
            await capture(page, `${viewportName.toLowerCase()}-candidate`);'''
          new2 = '''  await capture(page, `${viewportName.toLowerCase()}-candidate`);
            await noHorizontalOverflow(page, `${viewportName}:CANDIDATE`);'''
          if old2 not in s:
              raise SystemExit('CANDIDATE_CAPTURE_TARGET_NOT_FOUND')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Authenticated Candidate and B2B browser journeys
        env:
          NODE_PATH: /tmp/the-lobby-playwright/node_modules
        run: node tests/authenticated-ui-qa.cjs
      - name: Upload internal UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-internal-ui-screenshots
          path: authenticated-ui-qa-artifacts/*.png
          retention-days: 1
          if-no-files-found: warn
      - name: Server diagnostics
        if: failure()
        run: tail -n 250 /tmp/the-lobby-auth-ui.log || true
      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/the-lobby-auth-ui.pid ]; then
            kill "$(cat /tmp/the-lobby-auth-ui.pid)" || true
          fi
