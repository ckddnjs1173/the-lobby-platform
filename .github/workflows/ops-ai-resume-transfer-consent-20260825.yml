name: Ops AI Resume Transfer Consent 2026-08-25

on:
  push:
    branches:
      - ops/ai-resume-transfer-consent-20260825

permissions:
  contents: write

jobs:
  patch-product-branch:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyDUMMYBUILDONLY000000000000000000
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: dummy-build-project
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: dummy-build-project.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
      GROQ_API_KEY: build-only
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: agent/launch-pool-foundation
          fetch-depth: 0

      - name: Guard expected head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "9fb5e307e4b8777f3e574e9cb5fdb68f2983f5e8"

      - name: Add public AI resume transfer disclosure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          register = Path('src/app/register/page.tsx')
          text = register.read_text(encoding='utf-8')

          old = '  const [hasAuthenticatedAccount, setHasAuthenticatedAccount] = useState(false);\n'
          new = old + '  const [aiTransferConsent, setAiTransferConsent] = useState(false);\n'
          if old not in text or 'aiTransferConsent' in text:
              raise SystemExit('REGISTER_STATE_GUARD_FAILED')
          text = text.replace(old, new, 1)

          old = '''    if (!source) {\n      toast.error("분석할 이력서 텍스트를 입력해주세요.");\n      return;\n    }\n\n    setLoading(true);'''
          new = '''    if (!source) {\n      toast.error("분석할 이력서 텍스트를 입력해주세요.");\n      return;\n    }\n\n    if (!aiTransferConsent) {\n      toast.error("AI 이력서 분석을 이용하려면 국외 처리 안내에 동의해주세요.");\n      return;\n    }\n\n    setLoading(true);'''
          if old not in text:
              raise SystemExit('REGISTER_TEXT_CONSENT_GUARD_FAILED')
          text = text.replace(old, new, 1)

          old = '''    if (!resumeFile) {\n      toast.error("분석할 이력서 파일을 선택해주세요.");\n      return;\n    }\n\n    setLoading(true);'''
          new = '''    if (!resumeFile) {\n      toast.error("분석할 이력서 파일을 선택해주세요.");\n      return;\n    }\n\n    if (!aiTransferConsent) {\n      toast.error("AI 이력서 분석을 이용하려면 국외 처리 안내에 동의해주세요.");\n      return;\n    }\n\n    setLoading(true);'''
          if old not in text:
              raise SystemExit('REGISTER_FILE_CONSENT_GUARD_FAILED')
          text = text.replace(old, new, 1)

          old = '''              <p className="mt-2 text-xs leading-6 text-brand-muted">파일과 원문은 구조화에만 사용하고 Firestore에는 저장하지 않습니다.</p>\n\n              <div className="mt-6 rounded-xl border border-dashed border-brand-line bg-brand-light p-5">'''
          new = '''              <p className="mt-2 text-xs leading-6 text-brand-muted">파일과 원문은 구조화에만 사용하고 Firestore에는 저장하지 않습니다. AI 분석은 선택 기능입니다.</p>\n\n              <div className="mt-4 rounded-xl border border-brand-line bg-brand-ivory p-4 text-[11px] leading-6 text-brand-muted">\n                <p className="font-bold text-brand-espresso">AI 이력서 분석 및 국외 처리 동의 (선택)</p>\n                <p className="mt-2">\n                  AI 분석을 실행하면 서버에서 추출한 이력서 텍스트(이름·연락처·이메일·경력·학력 등이 포함될 수 있음)가 미국의 Groq LLC로 암호화 전송되어 프로필 구조화에 사용됩니다. 원본 이력서 파일 자체는 Groq에 전송하지 않습니다.\n                </p>\n                <p className="mt-2">\n                  이전 시점·방법: AI 분석 버튼을 누른 때 API를 통한 암호화 전송 · 이전받는 자: Groq LLC, P.O. Box 1778, Mountain View, CA 94042, USA · 보유기간: inference 입력·출력은 기본적으로 보관하지 않으나 시스템 안정성·남용 조사 시 최대 30일 임시 보관될 수 있습니다.\n                </p>\n                <p className="mt-2">\n                  동의를 거부하면 AI 분석만 사용할 수 없으며 직접 입력으로 프로필을 등록할 수 있습니다. 자세한 내용은 <Link href="/privacy" className="font-bold text-brand-bronze underline">개인정보 처리방침</Link>을 확인해주세요.\n                </p>\n                <label className="mt-3 flex cursor-pointer items-start gap-2 rounded-lg border border-brand-line bg-white px-3 py-3 text-brand-ink">\n                  <input\n                    type="checkbox"\n                    checked={aiTransferConsent}\n                    onChange={(event) => setAiTransferConsent(event.target.checked)}\n                    disabled={loading}\n                    className="mt-1 h-4 w-4 accent-brand-bronze"\n                  />\n                  <span className="font-bold">위 AI 이력서 분석 및 미국 국외 처리에 동의합니다.</span>\n                </label>\n              </div>\n\n              <div className="mt-6 rounded-xl border border-dashed border-brand-line bg-brand-light p-5">'''
          if old not in text:
              raise SystemExit('REGISTER_DISCLOSURE_INSERT_FAILED')
          text = text.replace(old, new, 1)
          register.write_text(text, encoding='utf-8')

          route = Path('src/app/api/ai-parse-resume/route.ts')
          text = route.read_text(encoding='utf-8')
          old = '          "입력한 이력서 원문과 업로드 원본 파일은 프로필 구조화에만 사용되며 The Lobby Firestore에는 저장하지 않습니다.",'
          new = '          "입력한 이력서 원문은 Groq LLC의 미국 인프라에서 AI 구조화에 사용될 수 있으며, 업로드 원본 파일 자체와 이력서 원문은 The Lobby Firestore에 저장하지 않습니다.",'
          if old not in text:
              raise SystemExit('ROUTE_NOTICE_GUARD_FAILED')
          text = text.replace(old, new, 1)
          route.write_text(text, encoding='utf-8')

          privacy = Path('src/app/privacy/page.tsx')
          text = privacy.read_text(encoding='utf-8')
          old = '''          <section><h2 className="text-base font-bold text-brand-espresso">6. 정보주체의 권리</h2><p className="mt-2">후보자는 자신의 프로필을 조회·수정하고, 인재풀 공개를 중지할 수 있습니다. 개인정보 열람·정정·삭제·처리정지 등 추가 요청은 개인정보 보호 담당 채널을 통해 접수할 수 있습니다.</p></section>\n          <section><h2 className="text-base font-bold text-brand-espresso">7. 파기 및 안전성 확보</h2><p className="mt-2">보유 필요가 없어진 개인정보는 복구가 어렵도록 파기하며, 접근권한 관리·인증·서버 측 권한 검증·테넌트 분리 등 서비스 구조에 맞는 기술적·관리적 보호조치를 적용합니다.</p></section>\n          <section><h2 className="text-base font-bold text-brand-espresso">8. 개인정보 보호 문의</h2><p className="mt-2">운영자: {operatorName}</p><p>{privacyContact ? `문의: ${privacyContact}` : "문의: 공개 운영 전 담당 연락처 확정 필요"}</p></section>\n          <section><h2 className="text-base font-bold text-brand-espresso">9. 변경 고지</h2><p className="mt-2">본 방침의 내용이 변경되는 경우 서비스 화면을 통해 변경 내용을 고지합니다.</p></section>'''
          new = '''          <section><h2 className="text-base font-bold text-brand-espresso">6. AI 이력서 분석 시 국외 처리</h2><p className="mt-2">AI 이력서 분석은 선택 기능입니다. 이용자가 별도 동의하고 AI 분석을 실행하는 경우, 서버에서 추출한 이력서 텍스트(이름·연락처·이메일·경력·학력 등이 포함될 수 있음)가 미국의 Groq LLC(P.O. Box 1778, Mountain View, CA 94042, USA)로 API를 통해 암호화 전송되어 프로필 구조화에 사용됩니다. 원본 이력서 파일 자체는 Groq에 전송하지 않습니다. Groq의 일반 inference 요청은 고객 입력·출력을 기본적으로 보관하지 않지만 시스템 안정성 또는 남용 조사 시 최대 30일 임시 보관될 수 있습니다. 동의를 거부하면 AI 분석은 사용할 수 없지만 직접 입력을 통한 프로필 등록은 가능합니다.</p></section>\n          <section><h2 className="text-base font-bold text-brand-espresso">7. 정보주체의 권리</h2><p className="mt-2">후보자는 자신의 프로필을 조회·수정하고, 인재풀 공개를 중지할 수 있습니다. 개인정보 열람·정정·삭제·처리정지 등 추가 요청은 개인정보 보호 담당 채널을 통해 접수할 수 있습니다.</p></section>\n          <section><h2 className="text-base font-bold text-brand-espresso">8. 파기 및 안전성 확보</h2><p className="mt-2">보유 필요가 없어진 개인정보는 복구가 어렵도록 파기하며, 접근권한 관리·인증·서버 측 권한 검증·테넌트 분리 등 서비스 구조에 맞는 기술적·관리적 보호조치를 적용합니다.</p></section>\n          <section><h2 className="text-base font-bold text-brand-espresso">9. 개인정보 보호 문의</h2><p className="mt-2">운영자: {operatorName}</p><p>{privacyContact ? `문의: ${privacyContact}` : "문의: 공개 운영 전 담당 연락처 확정 필요"}</p></section>\n          <section><h2 className="text-base font-bold text-brand-espresso">10. 변경 고지</h2><p className="mt-2">본 방침의 내용이 변경되는 경우 서비스 화면을 통해 변경 내용을 고지합니다.</p></section>'''
          if old not in text:
              raise SystemExit('PRIVACY_AI_TRANSFER_INSERT_FAILED')
          text = text.replace(old, new, 1)
          privacy.write_text(text, encoding='utf-8')

          launch = Path('tests/launch-readiness-check.cjs')
          text = launch.read_text(encoding='utf-8')
          marker = 'console.log("LAUNCH_READINESS_CHECK_PASSED");'
          guard = '''\nconst publicRegisterSource = fs.readFileSync("src/app/register/page.tsx", "utf8");\nconst publicResumeRouteSource = fs.readFileSync("src/app/api/ai-parse-resume/route.ts", "utf8");\nconst privacyPolicySource = fs.readFileSync("src/app/privacy/page.tsx", "utf8");\n\nfor (const requiredSnippet of [\n  "aiTransferConsent",\n  "AI 이력서 분석 및 국외 처리 동의",\n  "Groq LLC",\n  "최대 30일",\n  "직접 입력",\n]) {\n  if (!publicRegisterSource.includes(requiredSnippet)) {\n    throw new Error(`PUBLIC_AI_RESUME_TRANSFER_DISCLOSURE_MISSING:${requiredSnippet}`);\n  }\n}\n\nif (!publicResumeRouteSource.includes("Groq LLC의 미국 인프라")) {\n  throw new Error("PUBLIC_AI_RESUME_API_NOTICE_MISSING");\n}\n\nfor (const requiredSnippet of ["AI 이력서 분석 시 국외 처리", "Groq LLC", "최대 30일"]) {\n  if (!privacyPolicySource.includes(requiredSnippet)) {\n    throw new Error(`PRIVACY_AI_TRANSFER_DISCLOSURE_MISSING:${requiredSnippet}`);\n  }\n}\n\n'''
          if marker not in text or 'PUBLIC_AI_RESUME_TRANSFER_DISCLOSURE_MISSING' in text:
              raise SystemExit('LAUNCH_GATE_INSERT_GUARD_FAILED')
          text = text.replace(marker, guard + marker, 1)
          launch.write_text(text, encoding='utf-8')
          PY

      - name: Verify syntax and launch gate
        shell: bash
        run: |
          node --check tests/launch-readiness-check.cjs
          npm ci
          npm run check:launch-readiness
          npm run build

      - name: Commit product branch change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/register/page.tsx src/app/api/ai-parse-resume/route.ts src/app/privacy/page.tsx tests/launch-readiness-check.cjs
          git diff --cached --check
          git commit -m "Privacy: disclose optional AI resume transfer"
          git push origin HEAD:agent/launch-pool-foundation
