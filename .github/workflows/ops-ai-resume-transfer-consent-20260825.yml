name: Ops Firestore Location Audit 2026-08-25

on:
  push:
    branches:
      - ops/ai-resume-transfer-consent-20260825

permissions:
  contents: read

jobs:
  firestore-location:
    runs-on: ubuntu-latest
    env:
      FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.FIREBASE_ADMIN_PROJECT_ID }}
      FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
      FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read default Firestore database metadata
        shell: bash
        run: |
          node - <<'NODE'
          const { initializeApp, cert, deleteApp } = require('firebase-admin/app');

          const projectId = process.env.FIREBASE_ADMIN_PROJECT_ID;
          const clientEmail = process.env.FIREBASE_ADMIN_CLIENT_EMAIL;
          const privateKey = (process.env.FIREBASE_ADMIN_PRIVATE_KEY || '').replace(/\\n/g, '\n');
          if (!projectId || !clientEmail || !privateKey) {
            throw new Error('FIREBASE_ADMIN_SECRETS_MISSING');
          }

          const app = initializeApp({
            credential: cert({ projectId, clientEmail, privateKey }),
            projectId,
          });

          (async () => {
            try {
              const token = await app.options.credential.getAccessToken();
              const response = await fetch(
                `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(projectId)}/databases/(default)`,
                { headers: { Authorization: `Bearer ${token.access_token}` } }
              );
              const body = await response.json();
              if (!response.ok) {
                throw new Error(`FIRESTORE_DATABASE_METADATA_FAILED:${response.status}:${body?.error?.message || 'unknown'}`);
              }
              console.log('FIRESTORE_LOCATION_ID:', body.locationId || 'UNKNOWN');
              console.log('FIRESTORE_DATABASE_TYPE:', body.type || 'UNKNOWN');
              console.log('FIRESTORE_DELETE_PROTECTION:', body.deleteProtectionState || 'UNKNOWN');
            } finally {
              await deleteApp(app);
            }
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : error);
            process.exit(1);
          });
          NODE
