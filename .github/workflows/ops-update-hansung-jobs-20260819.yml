name: Ops Update Hansung Jobs 2026-08-19

on:
  workflow_dispatch:
  push:
    branches:
      - ops/update-hansung-jobs-20260819
    paths:
      - scripts/ops/update-hansung-jobs-20260819.cjs

permissions:
  contents: write

jobs:
  update-hansung-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.FIREBASE_ADMIN_PROJECT_ID }}
      FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
      FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
      APPLY: "true"

    steps:
      - name: Checkout ops branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Firebase Admin secrets
        shell: bash
        run: |
          missing=0
          for key in FIREBASE_ADMIN_PROJECT_ID FIREBASE_ADMIN_CLIENT_EMAIL FIREBASE_ADMIN_PRIVATE_KEY; do
            if [ -z "${!key}" ]; then
              echo "MISSING_SECRET:$key"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: npm ci

      - name: Update existing Hansung reception jobs and persist result
        shell: bash
        run: |
          mkdir -p ops-results
          set +e
          node scripts/ops/update-hansung-jobs-20260819.cjs 2>&1 | tee ops-results/hansung-jobs-20260819.txt
          status=${PIPESTATUS[0]}
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops-results/hansung-jobs-20260819.txt
          git commit -m "Ops result: Hansung job update" || true
          git push origin HEAD:ops/update-hansung-jobs-20260819

          exit "$status"
