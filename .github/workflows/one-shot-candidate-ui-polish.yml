name: One-shot Candidate Portal polish

on:
  push:
    branches: [ui/authenticated-workspace-polish]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[candidate-polish-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/authenticated-workspace-polish
          fetch-depth: 0
      - name: Patch Candidate Portal responsive hierarchy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/candidate/page.tsx')
          s = p.read_text()

          replacements = [
            ('className="scroll-mt-24 mx-auto max-w-[1480px] px-5 pb-16 pt-28 sm:px-8 lg:px-10"', 'className="scroll-mt-24 mx-auto w-full max-w-[1480px] px-5 pb-16 pt-28 sm:px-8 lg:px-10"'),
            ('className="grid gap-6 xl:grid-cols-[250px_minmax(0,1fr)_330px]"', 'className="grid min-w-0 gap-6 xl:grid-cols-[250px_minmax(0,1fr)_330px]"'),
            ('<aside className="space-y-4">', '<aside className="min-w-0 space-y-4">', 1),
            ('<nav className="overflow-hidden rounded-xl border border-brand-line bg-white shadow-card">', '<nav className="hidden overflow-hidden rounded-xl border border-brand-line bg-white shadow-card xl:block">', 1),
            ('<div className="rounded-xl border border-brand-line bg-brand-espresso p-5 text-white shadow-card">', '<div className="hidden rounded-xl border border-brand-line bg-brand-espresso p-5 text-white shadow-card xl:block">', 1),
            ('<div className="space-y-5">\n            <section id="candidate-profile"', '<div className="min-w-0 space-y-5">\n            <section id="candidate-profile"', 1),
            ('<aside className="space-y-5">\n            <section id="candidate-interviews"', '<aside className="min-w-0 space-y-5">\n            <section id="candidate-interviews"', 1),
            ('className="scroll-mt-24 rounded-xl border border-brand-line bg-white p-6 shadow-card"', 'className="scroll-mt-24 rounded-xl border border-brand-line bg-white p-5 shadow-card sm:p-6"', 1),
            ('className="flex h-20 w-20 shrink-0 items-center justify-center rounded-full', 'className="flex h-16 w-16 shrink-0 items-center justify-center rounded-full sm:h-20 sm:w-20', 1),
            ('className="font-editorial mt-1 truncate text-[28px] text-brand-espresso"', 'className="font-editorial mt-1 truncate text-[24px] text-brand-espresso sm:text-[28px]"', 1),
            ('className="mt-3 flex flex-wrap gap-x-5 gap-y-1 text-[11px] text-brand-muted"', 'className="mt-3 grid min-w-0 gap-1 text-xs text-brand-muted sm:flex sm:flex-wrap sm:gap-x-5 sm:gap-y-1"', 1),
            ('<span>{profile.phone}</span><span>{profile.email}</span>', '<span>{profile.phone}</span><span className="min-w-0 break-all">{profile.email}</span>', 1),
            ('className="min-w-[170px] border-l-0 border-brand-line md:border-l md:pl-6"', 'className="w-full border-l-0 border-brand-line md:w-auto md:min-w-[170px] md:border-l md:pl-6"', 1),
            ('<section id="candidate-applications" className="scroll-mt-24 rounded-xl border border-brand-line bg-white p-5 shadow-card">', '<section id="candidate-applications" className="scroll-mt-24 min-w-0 rounded-xl border border-brand-line bg-white p-4 shadow-card sm:p-5">', 1),
            ('<div className="flex items-center justify-between">\n                <div>\n                  <h2 className="text-base font-bold text-brand-espresso">지원현황</h2>', '<div className="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">\n                <div>\n                  <h2 className="text-base font-bold text-brand-espresso">지원현황</h2>', 1),
          ]

          for item in replacements:
              if len(item) == 2:
                  old, new = item
                  count = s.count(old)
                  if count == 0:
                      raise SystemExit(f'TARGET_NOT_FOUND: {old[:80]}')
                  s = s.replace(old, new)
              else:
                  old, new, limit = item
                  if old not in s:
                      raise SystemExit(f'TARGET_NOT_FOUND: {old[:80]}')
                  s = s.replace(old, new, limit)

          # Lift undersized Candidate-only typography one step without cascading replacements.
          s = s.replace('text-[11px]', 'text-[__CANDIDATE_11__]')
          s = s.replace('text-[10px]', 'text-[11px]')
          s = s.replace('text-[9px]', 'text-[10px]')
          s = s.replace('text-[__CANDIDATE_11__]', 'text-xs')

          p.write_text(s)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/one-shot-candidate-ui-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/candidate/page.tsx .github/workflows/one-shot-candidate-ui-polish.yml
          git commit -m "Polish Candidate Portal responsive hierarchy [candidate-polish-done]"
          git push origin HEAD:ui/authenticated-workspace-polish
