name: Production Smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validated main
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run production smoke
        env:
          PRODUCTION_BASE_URL: https://the-lobby-platform-ten.vercel.app
        run: node tests/phase10-production-smoke.cjs

      - name: Verify additional public/auth boundaries
        env:
          PRODUCTION_BASE_URL: https://the-lobby-platform-ten.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          check_status() {
            path="$1"
            expected="$2"
            status="$(curl -sS -L -o /tmp/response-body -w '%{http_code}' "$PRODUCTION_BASE_URL$path")"
            echo "$path: $status (expected $expected)"
            if [ "$status" != "$expected" ]; then
              echo "Unexpected response body:"
              head -c 1000 /tmp/response-body || true
              exit 1
            fi
          }
          check_status /register 200
          check_status /api/public/jobs 200
          check_status /api/candidate/me 401
          check_status /api/b2b/session 401
          echo "ADDITIONAL_PRODUCTION_BOUNDARY_CHECKS_PASSED"
