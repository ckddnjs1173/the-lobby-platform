name: Production Smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read production Firebase runtime diagnostic
        env:
          PRODUCTION_BASE_URL: https://the-lobby-platform-ten.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -L -o /tmp/runtime-diagnostic -w '%{http_code}' "$PRODUCTION_BASE_URL/api/runtime-diagnostic")"
          echo "PRODUCTION_DIAGNOSTIC_STATUS:$status"
          cat /tmp/runtime-diagnostic
          echo
          test "$status" = "200"
