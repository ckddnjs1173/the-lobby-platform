name: Patch authenticated UI QA selectors

on:
  push:
    branches: [ops/authenticated-ui-qa]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[selector-fix-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/authenticated-ui-qa
          fetch-depth: 0
      - name: Patch selectors
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/authenticated-ui-qa.cjs')
          s = p.read_text()
          s = s.replace('  await page.getByText("지원현황", { exact: true }).first().waitFor({ state: "visible", timeout: 15000 });\n', '  await page.locator("main").waitFor({ state: "visible", timeout: 15000 });\n  await page.waitForTimeout(1200);\n', 1)
          s = s.replace('  await page.getByText("지원자 파이프라인", { exact: true }).first().waitFor({ state: "visible", timeout: 15000 });\n', '  await page.locator("main").waitFor({ state: "visible", timeout: 15000 });\n  await page.waitForTimeout(1200);\n', 1)
          p.write_text(s)
          PY
      - name: Remove patch workflow and commit
        run: |
          rm .github/workflows/patch-auth-ui-selector.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/authenticated-ui-qa.cjs .github/workflows/patch-auth-ui-selector.yml
          git commit -m "Fix authenticated UI QA visibility selectors [selector-fix-done]"
          git push origin HEAD:ops/authenticated-ui-qa
