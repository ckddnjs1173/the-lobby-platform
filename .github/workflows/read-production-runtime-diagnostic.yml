name: Final Production Smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify final production endpoints
        env:
          PRODUCTION_BASE_URL: https://the-lobby-platform-ten.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          check_status() {
            path="$1"
            expected="$2"
            rm -f /tmp/body
            status="$(curl -sS -L -o /tmp/body -w '%{http_code}' "$PRODUCTION_BASE_URL$path")"
            echo "$path STATUS:$status EXPECTED:$expected"
            if [ "$status" != "$expected" ]; then
              echo "BODY_BEGIN"
              head -c 1200 /tmp/body || true
              echo
              echo "BODY_END"
              failures=$((failures + 1))
            fi
          }

          check_status /api/health 200
          check_status /api/readiness 200
          check_status /api/public/jobs 200
          check_status /api/candidate/me 401
          check_status /api/b2b/session 401
          check_status / 200
          check_status /jobs 200
          check_status /login 200
          check_status /register 200
          check_status /b2b-admin/login 200
          check_status /api/runtime-diagnostic 404

          readiness="$(curl -sS -L "$PRODUCTION_BASE_URL/api/readiness")"
          echo "READINESS_BODY:$readiness"
          if ! printf '%s' "$readiness" | grep -q '"status":"ready"'; then failures=$((failures + 1)); fi
          if ! printf '%s' "$readiness" | grep -q '"environment":true'; then failures=$((failures + 1)); fi
          if ! printf '%s' "$readiness" | grep -q '"firestore":true'; then failures=$((failures + 1)); fi
          if ! printf '%s' "$readiness" | grep -q '"candidateAuth":true'; then failures=$((failures + 1)); fi
          if ! printf '%s' "$readiness" | grep -q '"aiResumeAndJobParsing":true'; then failures=$((failures + 1)); fi
          if ! printf '%s' "$readiness" | grep -q '"communicationMode":"MANUAL"'; then failures=$((failures + 1)); fi
          if ! printf '%s' "$readiness" | grep -q '"revision":"038f5a37e29027ddd6db3c94f6e03c836c9270f0"'; then failures=$((failures + 1)); fi

          echo "FINAL_PRODUCTION_SMOKE_FAILURES:$failures"
          exit "$failures"
