name: One-shot B2B responsive polish

on:
  push:
    branches: [ui/authenticated-workspace-polish]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[b2b-responsive-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/authenticated-workspace-polish
          fetch-depth: 0
      - name: Patch B2B responsive UI
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'TARGET_NOT_FOUND:{path}:{old[:100]}')
              p.write_text(s.replace(old, new, 1))

          # 1) B2B shell typography: remove remaining 7-10px micro text.
          p = Path('src/app/b2b-admin/layout.tsx')
          s = p.read_text()
          s = s.replace('text-[10px]', 'text-[__B2B10__]')
          s = s.replace('text-[9px]', 'text-[10px]')
          s = s.replace('text-[8px]', 'text-[9px]')
          s = s.replace('text-[7px]', 'text-[9px]')
          s = s.replace('text-[__B2B10__]', 'text-[11px]')
          s = s.replace('className="text-[13px] font-bold"', 'className="text-sm font-bold"')
          p.write_text(s)

          # 2) Pipeline controls / metrics typography uplift.
          p = Path('src/app/b2b-admin/page.tsx')
          s = p.read_text()
          s = s.replace('text-[10px]', 'text-[__PIPE10__]')
          s = s.replace('text-[9px]', 'text-[10px]')
          s = s.replace('text-[__PIPE10__]', 'text-[11px]')
          s = s.replace('text-[12px] font-bold text-brand-ink', 'text-[13px] font-bold text-brand-ink')
          p.write_text(s)

          # 3) ApplicationTable: add mobile cards and keep full desktop table from md upward.
          path = 'src/components/b2b-admin/ApplicationTable.tsx'
          p = Path(path)
          s = p.read_text()
          old = '''    <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col h-full">\n      <div className="overflow-x-auto flex-1">'''
          new = '''    <div className="flex h-full flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">\n      <div className="space-y-3 p-3 md:hidden">\n        {applications.length > 0 ? (\n          applications.map((application) => {\n            const recruiterName = recruiterNames[application.recruiterId] || application.recruiterId;\n            const isStale = staleApplicationIds?.has(application.applicationId) || false;\n\n            return (\n              <article\n                key={`mobile-${application.applicationId}`}\n                onClick={() => onSelectApplication(application)}\n                className="rounded-xl border border-slate-200 bg-white p-4 shadow-sm"\n              >\n                <div className="flex items-start justify-between gap-3">\n                  <div className="min-w-0">\n                    <p className="text-sm font-bold text-slate-900">{application.candidateName}</p>\n                    <p className="mt-1 text-xs text-slate-500">{application.candidatePhone}</p>\n                    <p className="mt-0.5 break-all text-xs text-slate-400">{application.candidateEmail}</p>\n                  </div>\n                  <span className="shrink-0 rounded-full bg-slate-100 px-2.5 py-1 text-xs font-bold text-slate-700">\n                    {STAGE_LABELS[application.stage]}\n                  </span>\n                </div>\n\n                <div className="mt-4 rounded-lg bg-slate-50 px-3 py-3">\n                  <p className="text-sm font-semibold text-slate-800">{application.jobTitle}</p>\n                  <p className="mt-1 text-xs font-medium text-brand-navy">{application.company}</p>\n                </div>\n\n                <div className="mt-3 flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-slate-500">\n                  <span>담당 · {recruiterName}</span>\n                  <span>지원 · {formatAppliedDate(application.appliedAt)}</span>\n                  {isStale ? <span className="font-bold text-amber-700">3일+ 미처리</span> : null}\n                </div>\n\n                <div className="mt-4 border-t border-slate-100 pt-3" onClick={(event) => event.stopPropagation()}>\n                  <label className="flex items-center justify-between gap-3">\n                    <span className="text-xs font-bold text-slate-500">진행 단계</span>\n                    <select\n                      value={application.stage}\n                      onChange={(event) => onStageChange(application.applicationId, event.target.value as ApplicationStage)}\n                      className="min-w-[136px] rounded-lg border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-700"\n                    >\n                      {Object.entries(STAGE_LABELS).map(([stage, label]) => {\n                        const typedStage = stage as ApplicationStage;\n                        const workflowOnly = WORKFLOW_ONLY_STAGES.has(typedStage) && application.stage !== typedStage;\n                        return <option key={stage} value={stage} disabled={workflowOnly}>{workflowOnly ? `${label} · 전용 처리` : label}</option>;\n                      })}\n                    </select>\n                  </label>\n                </div>\n              </article>\n            );\n          })\n        ) : (\n          <div className="py-12 text-center text-sm font-medium text-slate-400">조건에 맞는 지원 내역이 없습니다.</div>\n        )}\n      </div>\n\n      <div className="hidden flex-1 overflow-x-auto md:block">'''
          if old not in s:
              raise SystemExit('APPLICATION_TABLE_TARGET_NOT_FOUND')
          p.write_text(s.replace(old, new, 1))

          # 4) Jobs: mobile cards before desktop table.
          path = 'src/app/b2b-admin/jobs/page.tsx'
          p = Path(path)
          s = p.read_text()
          old = '''        ) : (\n          <div className="overflow-x-auto">\n            <table className="w-full border-collapse text-left">'''
          new = '''        ) : (\n          <>\n            <div className="space-y-3 p-3 md:hidden">\n              {jobs.map((job) => (\n                <article key={`mobile-${job.jobId}`} className="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">\n                  <div className="flex items-start justify-between gap-3">\n                    <div className="min-w-0">\n                      <h3 className="break-keep text-base font-bold leading-snug text-slate-900">{job.title}</h3>\n                      <p className="mt-1 text-xs font-semibold text-slate-500">{job.displayCompany}</p>\n                    </div>\n                    <select\n                      value={job.status}\n                      disabled={updatingJobId === job.jobId || saving}\n                      onChange={(event) => void handleStatusChange(job, event.target.value as JobStatus)}\n                      className="shrink-0 rounded-lg border border-slate-200 bg-white px-2.5 py-2 text-xs font-semibold"\n                    >\n                      <option value="OPEN">공개중</option>\n                      <option value="DRAFT">작성중</option>\n                      <option value="CLOSED">마감</option>\n                    </select>\n                  </div>\n\n                  <dl className="mt-4 grid grid-cols-2 gap-3 rounded-lg bg-slate-50 p-3 text-xs">\n                    <div><dt className="text-slate-400">근무지</dt><dd className="mt-1 font-semibold text-slate-700">{job.location}</dd></div>\n                    <div><dt className="text-slate-400">고용형태</dt><dd className="mt-1 font-semibold text-slate-700">{job.employmentType}</dd></div>\n                    <div className="col-span-2"><dt className="text-slate-400">급여</dt><dd className="mt-1 font-semibold text-slate-700">{job.salary}</dd></div>\n                  </dl>\n\n                  <div className="mt-4 flex items-center justify-between gap-3 border-t border-slate-100 pt-3">\n                    <div className="min-w-0 text-[11px] text-slate-400">\n                      <p>수정 {formatDate(job.updatedAt)}</p>\n                      <p className="mt-1 truncate">{job.organizationId}</p>\n                    </div>\n                    <button type="button" onClick={() => startEdit(job)} className="shrink-0 rounded-lg border border-slate-200 px-3 py-2 text-xs font-bold text-brand-navy">내용 수정</button>\n                  </div>\n                </article>\n              ))}\n            </div>\n\n            <div className="hidden overflow-x-auto md:block">\n            <table className="w-full border-collapse text-left">'''
          if old not in s:
              raise SystemExit('JOBS_TABLE_TARGET_NOT_FOUND')
          s = s.replace(old, new, 1)
          old_close = '''            </table>\n          </div>\n        )}'''
          new_close = '''            </table>\n            </div>\n          </>\n        )}'''
          if old_close not in s:
              raise SystemExit('JOBS_TABLE_CLOSE_TARGET_NOT_FOUND')
          p.write_text(s.replace(old_close, new_close, 1))

          # 5) Candidate CRM: mobile cards before desktop table; elevate explainer text.
          path = 'src/app/b2b-admin/candidates/page.tsx'
          p = Path(path)
          s = p.read_text()
          s = s.replace('text-[10px] leading-5 text-slate-400', 'text-[11px] leading-5 text-slate-500')
          old = '''        ) : (\n          <div className="overflow-x-auto">\n            <table className="min-w-full text-left text-sm">'''
          new = '''        ) : (\n          <>\n            <div className="space-y-3 md:hidden">\n              {candidates.map((candidate) => (\n                <article key={`mobile-${candidate.candidateId}`} className="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">\n                  <div className="flex items-start justify-between gap-3">\n                    <div className="min-w-0">\n                      <a href={`/b2b-admin/candidates/${encodeURIComponent(candidate.candidateId)}`} className="text-base font-bold text-slate-900">{candidate.name}</a>\n                      <p className="mt-1 text-xs text-slate-500">{candidate.phone}</p>\n                      <p className="mt-0.5 break-all text-xs text-slate-400">{candidate.email}</p>\n                    </div>\n                    <div className="shrink-0 text-right">\n                      <p className="text-lg font-bold text-brand-navy">{candidate.profileCompleteness}%</p>\n                      <p className="text-[11px] text-slate-400">{candidate.accountStatus}</p>\n                    </div>\n                  </div>\n\n                  <div className="mt-4 rounded-lg bg-slate-50 p-3">\n                    <p className="text-sm font-semibold text-slate-700">{candidate.headline || "등록된 헤드라인 없음"}</p>\n                    <div className="mt-2 flex flex-wrap gap-1.5">\n                      {candidate.skills.length > 0 ? candidate.skills.slice(0, 5).map((skill) => (\n                        <span key={`mobile-${candidate.candidateId}-${skill}`} className="rounded-full border border-slate-200 bg-white px-2.5 py-1 text-[11px] text-slate-600">{skill}</span>\n                      )) : <span className="text-xs text-slate-400">등록된 스킬 없음</span>}\n                    </div>\n                  </div>\n\n                  <div className="mt-4 flex items-center justify-between gap-3 border-t border-slate-100 pt-3">\n                    <div className="text-[11px] text-slate-500">\n                      <p>등록 · {candidate.createdByName || candidate.createdBy}</p>\n                      <p className="mt-1">갱신 · {formatDate(candidate.updatedAt || candidate.createdAt)}</p>\n                    </div>\n                    <a href={`/b2b-admin/candidates/${encodeURIComponent(candidate.candidateId)}`} className="shrink-0 rounded-lg border border-slate-200 px-3 py-2 text-xs font-bold text-brand-navy">상세 / 수정</a>\n                  </div>\n                </article>\n              ))}\n            </div>\n\n            <div className="hidden overflow-x-auto md:block">\n            <table className="min-w-full text-left text-sm">'''
          if old not in s:
              raise SystemExit('CANDIDATES_TABLE_TARGET_NOT_FOUND')
          s = s.replace(old, new, 1)
          old_close = '''            </table>\n          </div>\n        )}'''
          new_close = '''            </table>\n            </div>\n          </>\n        )}'''
          if old_close not in s:
              raise SystemExit('CANDIDATES_TABLE_CLOSE_TARGET_NOT_FOUND')
          p.write_text(s.replace(old_close, new_close, 1))
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/one-shot-b2b-responsive-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/b2b-admin/layout.tsx src/app/b2b-admin/page.tsx src/app/b2b-admin/jobs/page.tsx src/app/b2b-admin/candidates/page.tsx src/components/b2b-admin/ApplicationTable.tsx .github/workflows/one-shot-b2b-responsive-polish.yml
          git commit -m "Polish B2B responsive workspace [b2b-responsive-done]"
          git push origin HEAD:ui/authenticated-workspace-polish
