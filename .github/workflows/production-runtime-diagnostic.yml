name: Production Runtime Diagnostic

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read sanitized production runtime status
        env:
          PRODUCTION_BASE_URL: https://the-lobby-platform-ten.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            status="$(curl -sS -L -o /tmp/diagnostic -w '%{http_code}' "$PRODUCTION_BASE_URL/api/runtime-diagnostic" || true)"
            if [ "$status" = "200" ]; then
              echo "PRODUCTION_DIAGNOSTIC_STATUS:200"
              cat /tmp/diagnostic
              echo
              exit 0
            fi
            echo "WAITING_FOR_DIAGNOSTIC attempt=$attempt status=$status"
            sleep 3
          done
          echo "DIAGNOSTIC_ENDPOINT_NOT_READY"
          cat /tmp/diagnostic 2>/dev/null || true
          exit 1
