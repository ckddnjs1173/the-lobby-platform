name: Release Verification

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  firebase-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.FIREBASE_ADMIN_PROJECT_ID }}
      FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
      FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      COMMUNICATION_FROM_EMAIL: ${{ secrets.COMMUNICATION_FROM_EMAIL }}
      COMMUNICATION_EMAIL_PROVIDER: RESEND
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release secret contract
        shell: bash
        run: |
          missing=0
          for key in \
            NEXT_PUBLIC_FIREBASE_API_KEY \
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN \
            NEXT_PUBLIC_FIREBASE_PROJECT_ID \
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET \
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID \
            NEXT_PUBLIC_FIREBASE_APP_ID \
            FIREBASE_ADMIN_PROJECT_ID \
            FIREBASE_ADMIN_CLIENT_EMAIL \
            FIREBASE_ADMIN_PRIVATE_KEY \
            GROQ_API_KEY \
            RESEND_API_KEY \
            COMMUNICATION_FROM_EMAIL
          do
            if [ -z "${!key}" ]; then
              echo "MISSING_RELEASE_SECRET:$key"
              missing=1
            else
              echo "RELEASE_SECRET_PRESENT:$key"
            fi
          done
          exit "$missing"

      - name: Materialize ephemeral release env
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          service_account = {
              "type": "service_account",
              "project_id": os.environ["FIREBASE_ADMIN_PROJECT_ID"],
              "private_key": os.environ["FIREBASE_ADMIN_PRIVATE_KEY"].replace("\\n", "\n"),
              "client_email": os.environ["FIREBASE_ADMIN_CLIENT_EMAIL"],
              "token_uri": "https://oauth2.googleapis.com/token",
          }
          service_path = Path("/tmp/the-lobby-release-service-account.json")
          service_path.write_text(json.dumps(service_account), encoding="utf-8")

          keys = [
              "NEXT_PUBLIC_FIREBASE_API_KEY",
              "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN",
              "NEXT_PUBLIC_FIREBASE_PROJECT_ID",
              "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET",
              "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID",
              "NEXT_PUBLIC_FIREBASE_APP_ID",
              "FIREBASE_ADMIN_PROJECT_ID",
              "FIREBASE_ADMIN_CLIENT_EMAIL",
              "FIREBASE_ADMIN_PRIVATE_KEY",
              "GROQ_API_KEY",
              "RESEND_API_KEY",
              "COMMUNICATION_FROM_EMAIL",
              "COMMUNICATION_EMAIL_PROVIDER",
          ]

          with open(".env.local", "w", encoding="utf-8") as handle:
              for key in keys:
                  handle.write(f"{key}={json.dumps(os.environ[key])}\n")
              handle.write(f"GOOGLE_APPLICATION_CREDENTIALS={json.dumps(str(service_path))}\n")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Production build with release configuration
        run: npm run build

      - name: Start release server
        shell: bash
        run: |
          npm start > /tmp/the-lobby-release-server.log 2>&1 &
          echo $! > /tmp/the-lobby-release-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              echo "RELEASE_SERVER_READY"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/the-lobby-release-server.log
          exit 1

      - name: Full Firebase-backed Phase 10 regression
        run: npm run check:phase10

      - name: Server diagnostics
        if: failure()
        run: tail -n 200 /tmp/the-lobby-release-server.log || true

      - name: Stop release server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/the-lobby-release-server.pid ]; then
            kill "$(cat /tmp/the-lobby-release-server.pid)" || true
          fi
          rm -f .env.local /tmp/the-lobby-release-service-account.json
