name: Browser E2E

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  public-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.FIREBASE_ADMIN_PROJECT_ID }}
      FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
      FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PUBLIC_ANALYTICS_DISABLED: "true"

    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Materialize ephemeral Firebase credentials
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          required = [
              "NEXT_PUBLIC_FIREBASE_API_KEY",
              "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN",
              "NEXT_PUBLIC_FIREBASE_PROJECT_ID",
              "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET",
              "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID",
              "NEXT_PUBLIC_FIREBASE_APP_ID",
              "FIREBASE_ADMIN_PROJECT_ID",
              "FIREBASE_ADMIN_CLIENT_EMAIL",
              "FIREBASE_ADMIN_PRIVATE_KEY",
              "GROQ_API_KEY",
          ]
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit("Missing browser-test secrets: " + ", ".join(missing))

          service_account = {
              "type": "service_account",
              "project_id": os.environ["FIREBASE_ADMIN_PROJECT_ID"],
              "private_key": os.environ["FIREBASE_ADMIN_PRIVATE_KEY"].replace("\\n", "\n"),
              "client_email": os.environ["FIREBASE_ADMIN_CLIENT_EMAIL"],
              "token_uri": "https://oauth2.googleapis.com/token",
          }
          service_path = Path("/tmp/the-lobby-browser-service-account.json")
          service_path.write_text(json.dumps(service_account), encoding="utf-8")

          with open(".env.local", "w", encoding="utf-8") as handle:
              for key in required:
                  handle.write(f"{key}={json.dumps(os.environ[key])}\n")
              handle.write(f"NEXT_PUBLIC_SITE_URL={json.dumps(os.environ['NEXT_PUBLIC_SITE_URL'])}\n")
              handle.write(f"GOOGLE_APPLICATION_CREDENTIALS={json.dumps(str(service_path))}\n")
          PY

      - name: Install application dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production server
        shell: bash
        run: |
          npm start > /tmp/the-lobby-browser-server.log 2>&1 &
          echo $! > /tmp/the-lobby-browser-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              echo "BROWSER_SERVER_READY"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/the-lobby-browser-server.log
          exit 1

      - name: Chromium public launch smoke
        run: npx playwright test --project=chromium

      - name: Browser server diagnostics
        if: failure()
        run: tail -n 200 /tmp/the-lobby-browser-server.log || true

      - name: Cleanup browser credentials
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/the-lobby-browser-server.pid ]; then
            kill "$(cat /tmp/the-lobby-browser-server.pid)" || true
          fi
          rm -f .env.local /tmp/the-lobby-browser-service-account.json
