name: Authenticated B2B Visual QA

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  b2b-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.FIREBASE_ADMIN_PROJECT_ID }}
      FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
      FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install isolated Chromium
        run: |
          npm install --prefix /tmp/the-lobby-playwright --no-package-lock playwright@1.55.0
          /tmp/the-lobby-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Materialize B2B-only authenticated QA script
        run: |
          curl -fsSL https://raw.githubusercontent.com/ckddnjs1173/the-lobby-platform/82fe491815b463d0c579b3d4ef611322c23cb62f/tests/authenticated-ui-qa.cjs -o tests/authenticated-ui-qa.cjs
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/authenticated-ui-qa.cjs')
          s = p.read_text()
          s = s.replace('    await candidateJourney(browser, "DESKTOP", { width: 1440, height: 1000 });\n', '')
          s = s.replace('    await candidateJourney(browser, "MOBILE", { width: 390, height: 844 });\n', '')
          p.write_text(s)
          PY
      - name: Start application
        shell: bash
        run: |
          npm start > /tmp/the-lobby-b2b-ui.log 2>&1 &
          echo $! > /tmp/the-lobby-b2b-ui.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              echo B2B_UI_SERVER_READY
              exit 0
            fi
            sleep 1
          done
          cat /tmp/the-lobby-b2b-ui.log
          exit 1
      - name: B2B authenticated browser journeys
        env:
          NODE_PATH: /tmp/the-lobby-playwright/node_modules
        run: node tests/authenticated-ui-qa.cjs
      - name: Upload B2B screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-b2b-ui-screenshots
          path: authenticated-ui-qa-artifacts/*.png
          retention-days: 1
          if-no-files-found: warn
      - name: Server diagnostics
        if: failure()
        run: tail -n 250 /tmp/the-lobby-b2b-ui.log || true
      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/the-lobby-b2b-ui.pid ]; then
            kill "$(cat /tmp/the-lobby-b2b-ui.pid)" || true
          fi
