name: Final QA Patch

on:
  push:
    branches:
      - agent/final-qa-predeploy

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.example.invalid
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: the-lobby-platform
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci.example.invalid
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:ci
      GROQ_API_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/final-qa-predeploy

      - name: Apply final QA patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')

          # 1) Home: turn decorative search/category controls into real GET filters.
          home_path = root / 'src/app/page.tsx'
          home = home_path.read_text(encoding='utf-8')

          home = re.sub(
              r'const ROLE_CATEGORIES = \[.*?\] as const;',
              '''const ROLE_CATEGORIES = [
            ["기업 리셉션", "Corporate Reception", "/jobs?category=corporate"],
            ["병원 · 클리닉", "Clinic / Hospital", "/jobs?category=clinic"],
            ["호텔 프론트", "Hotel Front", "/jobs?category=hotel"],
            ["전시장 · 쇼룸", "Showroom", "/jobs?category=showroom"],
            ["서비스 데스크", "Service Desk", "/jobs?q=서비스"],
            ["VIP 라운지", "VIP Lounge", "/jobs?category=lounge"],
          ] as const;''',
              home,
              count=1,
              flags=re.S,
          )
          home = re.sub(
              r'\nfunction ChevronIcon\(\) \{.*?\n\}\n',
              '\n',
              home,
              count=1,
              flags=re.S,
          )

          search_pattern = re.compile(
              r'        <div className="relative z-10 mx-auto -mt-7 max-w-\[1320px\] px-5 pb-8 sm:px-8 lg:-mt-8">.*?        </div>\n      </section>',
              re.S,
          )
          search_replacement = '''        <div className="relative z-10 mx-auto -mt-7 max-w-[1320px] px-5 pb-8 sm:px-8 lg:-mt-8">
            <form
              action="/jobs"
              method="get"
              className="lobby-glass grid overflow-hidden rounded-xl border border-brand-line shadow-soft sm:grid-cols-2 lg:grid-cols-[1.25fr_0.8fr_0.8fr_0.8fr_76px]"
            >
              <label className="flex min-h-[66px] items-center gap-3 border-b border-brand-line px-5 py-4 sm:border-r lg:border-b-0">
                <span className="text-brand-bronze"><SearchIcon /></span>
                <span className="min-w-0 flex-1">
                  <span className="block text-[9px] font-bold uppercase tracking-[0.18em] text-brand-muted">키워드</span>
                  <input
                    name="q"
                    placeholder="직무, 회사, 지역"
                    className="mt-1 w-full bg-transparent text-sm font-semibold text-brand-espresso outline-none placeholder:font-normal placeholder:text-brand-muted/65"
                  />
                </span>
              </label>

              <label className="border-b border-brand-line px-5 py-3.5 sm:border-r lg:border-b-0">
                <span className="block text-[9px] font-bold uppercase tracking-[0.18em] text-brand-muted">지역</span>
                <select name="location" defaultValue="" className="mt-1 w-full bg-transparent text-sm font-semibold text-brand-espresso outline-none">
                  <option value="">전체 지역</option>
                  <option value="서울">서울</option>
                  <option value="경기">경기</option>
                  <option value="인천">인천</option>
                  <option value="부산">부산</option>
                  <option value="제주">제주</option>
                </select>
              </label>

              <label className="border-b border-brand-line px-5 py-3.5 sm:border-r lg:border-b-0">
                <span className="block text-[9px] font-bold uppercase tracking-[0.18em] text-brand-muted">직무</span>
                <select name="category" defaultValue="" className="mt-1 w-full bg-transparent text-sm font-semibold text-brand-espresso outline-none">
                  <option value="">전체 직무</option>
                  <option value="corporate">기업 리셉션</option>
                  <option value="clinic">병원 · 클리닉</option>
                  <option value="hotel">호텔 프론트</option>
                  <option value="showroom">전시장 · 쇼룸</option>
                  <option value="lounge">VIP 라운지</option>
                </select>
              </label>

              <label className="px-5 py-3.5 sm:border-r">
                <span className="block text-[9px] font-bold uppercase tracking-[0.18em] text-brand-muted">근무형태</span>
                <select name="employment" defaultValue="" className="mt-1 w-full bg-transparent text-sm font-semibold text-brand-espresso outline-none">
                  <option value="">전체 형태</option>
                  <option value="정규직">정규직</option>
                  <option value="계약직">계약직</option>
                  <option value="파견계약직">파견계약직</option>
                  <option value="인턴">인턴</option>
                </select>
              </label>

              <button type="submit" aria-label="채용공고 검색" className="flex min-h-[66px] items-center justify-center bg-brand-bronze text-white transition hover:bg-brand-espresso">
                <SearchIcon />
              </button>
            </form>
          </div>
      </section>'''
          home, count = search_pattern.subn(search_replacement, home, count=1)
          if count != 1:
              raise SystemExit('HOME_SEARCH_BLOCK_PATCH_FAILED')

          home = home.replace(
              'ROLE_CATEGORIES.map(([title, subtitle], index) => (',
              'ROLE_CATEGORIES.map(([title, subtitle, href], index) => (',
              1,
          )
          home, count = re.subn(
              r'(ROLE_CATEGORIES\.map\(\(\[title, subtitle, href\], index\) => \(\s*<Link\s+key=\{title\}\s+)href="/jobs"',
              r'\1href={href}',
              home,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('HOME_CATEGORY_LINK_PATCH_FAILED')
          home_path.write_text(home, encoding='utf-8')

          # 2) Jobs: hydrate filters from URL, use broad region filtering and make search button meaningful/shareable.
          jobs_path = root / 'src/app/jobs/page.tsx'
          jobs = jobs_path.read_text(encoding='utf-8')

          state_anchor = '  const [employment, setEmployment] = useState("ALL");\n'
          state_insert = state_anchor + '''\n  useEffect(() => {
            const params = new URLSearchParams(window.location.search);
            const requestedCategory = params.get("category");
            const validCategory = CATEGORY_OPTIONS.some(
              (option) => option.value !== "ALL" && option.value === requestedCategory
            );

            setKeyword(params.get("q") || "");
            setCategory(validCategory ? (requestedCategory as JobVisualCategory) : "ALL");
            setLocation(params.get("location") || "ALL");
            setEmployment(params.get("employment") || "ALL");
          }, []);\n'''
          if state_anchor not in jobs:
              raise SystemExit('JOBS_STATE_ANCHOR_MISSING')
          jobs = jobs.replace(state_anchor, state_insert, 1)

          jobs = jobs.replace(
              'Array.from(new Set(jobs.map((job) => formatJobLocation(job.location)))).sort((a, b) =>',
              'Array.from(\n        new Set(\n          jobs\n            .map((job) => formatJobLocation(job.location).split(" ")[0])\n            .filter(Boolean)\n        )\n      ).sort((a, b) =>',
              1,
          )
          jobs = jobs.replace(
              'if (location !== "ALL" && formatJobLocation(job.location) !== location) return false;',
              'if (\n        location !== "ALL" &&\n        !formatJobLocation(job.location).startsWith(location)\n      ) return false;',
              1,
          )

          filtered_anchor = '  }, [category, employment, jobs, keyword, location]);\n\n  const handleApply = async (jobId: string) => {'
          sync_fn = '''  }, [category, employment, jobs, keyword, location]);

          const syncFiltersToUrl = (
            nextCategory: "ALL" | JobVisualCategory = category
          ) => {
            const params = new URLSearchParams();
            const normalizedKeyword = keyword.trim();

            if (normalizedKeyword) params.set("q", normalizedKeyword);
            if (nextCategory !== "ALL") params.set("category", nextCategory);
            if (location !== "ALL") params.set("location", location);
            if (employment !== "ALL") params.set("employment", employment);

            const query = params.toString();
            router.replace(query ? `/jobs?${query}` : "/jobs", { scroll: false });
          };

          const handleApply = async (jobId: string) => {'''
          if filtered_anchor not in jobs:
              raise SystemExit('JOBS_FILTERED_ANCHOR_MISSING')
          jobs = jobs.replace(filtered_anchor, sync_fn, 1)

          jobs = jobs.replace(
              'onChange={(event) => setKeyword(event.target.value)}\n                  placeholder="직무, 회사, 지역 검색"',
              'onChange={(event) => setKeyword(event.target.value)}\n                  onKeyDown={(event) => {\n                    if (event.key === "Enter") {\n                      event.preventDefault();\n                      syncFiltersToUrl();\n                    }\n                  }}\n                  placeholder="직무, 회사, 지역 검색"',
              1,
          )
          jobs = jobs.replace(
              '<button type="button" aria-label="채용공고 검색" className="flex min-h-[64px] items-center justify-center bg-brand-bronze text-white transition hover:bg-brand-espresso lg:min-h-0">',
              '<button type="button" onClick={() => syncFiltersToUrl()} aria-label="채용공고 검색" className="flex min-h-[64px] items-center justify-center bg-brand-bronze text-white transition hover:bg-brand-espresso lg:min-h-0">',
              1,
          )
          jobs = jobs.replace(
              'onClick={() => setCategory(option.value)}',
              'onClick={() => {\n                    setCategory(option.value);\n                    syncFiltersToUrl(option.value);\n                  }}',
              1,
          )
          jobs = jobs.replace(
              'setEmployment("ALL");\n              }}',
              'setEmployment("ALL");\n                router.replace("/jobs", { scroll: false });\n              }}',
              1,
          )
          jobs_path.write_text(jobs, encoding='utf-8')

          # 3) Generic frontend -> App Router API contract gate.
          contract = r'''const fs = require("fs");
          const path = require("path");

          const root = path.resolve(__dirname, "..");

          function walk(directory) {
            return fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
              const target = path.join(directory, entry.name);
              return entry.isDirectory() ? walk(target) : [target];
            });
          }

          function normalizeRoute(value) {
            return value
              .replace(/\\/g, "/")
              .replace(/^.*src\/app\/api/, "/api")
              .replace(/\/route\.ts$/, "")
              .replace(/\[[^/]+\]/g, "*")
              .replace(/\/+/g, "/");
          }

          function normalizeClientEndpoint(value) {
            return value
              .replace(/\$\{[^}]+\}/g, "*")
              .split("?")[0]
              .replace(/\/+/g, "/")
              .replace(/\/$/, "");
          }

          const apiRoot = path.join(root, "src", "app", "api");
          const routePatterns = new Set(
            walk(apiRoot)
              .filter((file) => file.endsWith(`${path.sep}route.ts`))
              .map(normalizeRoute)
          );

          const clientFiles = walk(path.join(root, "src", "lib"))
            .filter((file) => /Api\.ts$/.test(file) && !file.includes(`${path.sep}server${path.sep}`));

          const discovered = [];
          const missing = [];
          const endpointRegex = /(?:"|'|`)(\/api\/[A-Za-z0-9_\-./\[\]${}]+)(?:"|'|`)/g;

          for (const file of clientFiles) {
            const source = fs.readFileSync(file, "utf8");
            for (const match of source.matchAll(endpointRegex)) {
              const raw = match[1];
              const endpoint = normalizeClientEndpoint(raw);
              if (!endpoint.startsWith("/api/")) continue;
              discovered.push({ file: path.relative(root, file), endpoint });
              if (!routePatterns.has(endpoint)) {
                missing.push({ file: path.relative(root, file), endpoint });
              }
            }
          }

          if (discovered.length < 10) {
            throw new Error(`FRONTEND_BACKEND_CONTRACT_DISCOVERY_TOO_SMALL:${discovered.length}`);
          }

          if (missing.length > 0) {
            console.error("Missing API route handlers:");
            for (const item of missing) console.error(`- ${item.file}: ${item.endpoint}`);
            throw new Error("FRONTEND_BACKEND_ROUTE_CONTRACT_FAILED");
          }

          const requiredRoutes = [
            "/api/public/jobs",
            "/api/public/jobs/*",
            "/api/applications/apply",
            "/api/candidate/me",
            "/api/candidate/applications",
            "/api/candidate/applications/*/cancel",
            "/api/b2b/session",
            "/api/b2b/applications",
            "/api/b2b/candidates",
            "/api/b2b/jobs",
            "/api/b2b/analytics",
            "/api/b2b/organizations",
            "/api/health",
            "/api/readiness",
          ];

          for (const route of requiredRoutes) {
            if (!routePatterns.has(route)) {
              throw new Error(`CRITICAL_ROUTE_MISSING:${route}`);
            }
          }

          console.log(`FRONTEND_BACKEND_CONTRACTS_DISCOVERED:${discovered.length}`);
          console.log(`APP_ROUTER_API_ROUTES_DISCOVERED:${routePatterns.size}`);
          console.log("FINAL_FRONTEND_BACKEND_CONTRACT_CHECK_PASSED");
          '''
          contract = '\n'.join(line[10:] if line.startswith('          ') else line for line in contract.splitlines()) + '\n'
          (root / 'tests/final-frontend-backend-contract-check.cjs').write_text(contract, encoding='utf-8')

          # 4) Wire final integration and dependency gates into scripts/CI/release static assertions.
          package_path = root / 'package.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          scripts = package.setdefault('scripts', {})
          scripts['check:final:integration'] = 'node tests/final-frontend-backend-contract-check.cjs'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          ci_path = root / '.github/workflows/ci.yml'
          ci = ci_path.read_text(encoding='utf-8')
          ci = ci.replace(
              '      - name: Production readiness static gate\n        run: npm run check:phase10:static\n',
              '      - name: Frontend/backend contract gate\n        run: npm run check:final:integration\n\n      - name: Dependency security gate\n        run: npm audit --omit=dev --audit-level=high\n\n      - name: Production readiness static gate\n        run: npm run check:phase10:static\n',
              1,
          )
          ci_path.write_text(ci, encoding='utf-8')

          readiness_path = root / 'tests/phase10-production-readiness-check.cjs'
          readiness = readiness_path.read_text(encoding='utf-8')
          readiness = readiness.replace(
              '    workflow.includes("npm run check:phase10:static") &&\n    workflow.includes("npm run build") &&',
              '    workflow.includes("npm run check:final:integration") &&\n    workflow.includes("npm audit --omit=dev --audit-level=high") &&\n    workflow.includes("npm run check:phase10:static") &&\n    workflow.includes("npm run build") &&',
              1,
          )
          readiness_path.write_text(readiness, encoding='utf-8')

          regression_path = root / 'tests/phase10-regression-check.cjs'
          regression = regression_path.read_text(encoding='utf-8')
          marker = '  {\n    name: "Phase 10 Production Readiness Static",'
          regression = regression.replace(
              marker,
              '  {\n    name: "Final Frontend Backend Contract",\n    args: [\n      "tests/final-frontend-backend-contract-check.cjs",\n    ],\n  },\n  {\n    name: "Phase 10 Production Readiness Static",',
              1,
          )
          regression_path.write_text(regression, encoding='utf-8')

          # Remove this one-shot patch workflow from the final diff.
          Path('.github/workflows/final-qa-patch.yml').unlink()
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Frontend/backend contract gate
        run: npm run check:final:integration

      - name: Production readiness static gate
        run: npm run check:phase10:static

      - name: Dependency security gate
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build

      - name: Diff sanity
        run: git diff --check

      - name: Commit final QA patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release: final predeploy QA polish"
          git push origin HEAD:agent/final-qa-predeploy
