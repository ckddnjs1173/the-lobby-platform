name: Internal Authenticated Visual Gate

on:
  pull_request:
    branches:
      - ui/authenticated-workspace-polish
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  authenticated-visual-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.FIREBASE_ADMIN_PROJECT_ID }}
      FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
      FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install isolated Chromium
        run: |
          npm install --prefix /tmp/the-lobby-playwright --no-package-lock playwright@1.55.0
          /tmp/the-lobby-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Materialize authenticated visual QA script
        run: |
          curl -fsSL https://raw.githubusercontent.com/ckddnjs1173/the-lobby-platform/82fe491815b463d0c579b3d4ef611322c23cb62f/tests/authenticated-ui-qa.cjs -o tests/authenticated-ui-qa.cjs
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/authenticated-ui-qa.cjs')
          s = p.read_text()

          candidate_menu = '''  if (viewport.width < 1024) {
            const menu = page.getByRole("button", { name: "메뉴 열기" });
            if (await menu.isVisible().catch(() => false)) {
              await menu.click();
              await capture(page, `${viewportName.toLowerCase()}-candidate-menu`);
              await menu.click();
            }
          }
'''
          if candidate_menu not in s:
              raise SystemExit('CANDIDATE_MENU_BLOCK_NOT_FOUND')
          s = s.replace(candidate_menu, '  // Candidate header menu already covered by public responsive QA.\n', 1)

          old_routes = '''  const routes = [
            ["/b2b-admin", "pipeline"],
            ["/b2b-admin/candidates", "candidates"],
            ["/b2b-admin/jobs", "jobs"],
            ["/b2b-admin/analytics", "analytics"],
          ];

          for (const [route, shot] of routes) {
            await page.goto(`${BASE_URL}${route}`, { waitUntil: "domcontentloaded" });
            await page.waitForTimeout(1100);
            await noHorizontalOverflow(page, `${viewportName}:B2B:${route}`);
            await capture(page, `${viewportName.toLowerCase()}-b2b-${shot}`);
          }
'''
          new_routes = '''  const routes = [
            ["/b2b-admin", "pipeline", "김라운지", true],
            ["/b2b-admin/candidates", "candidates", "김라운지", true],
            ["/b2b-admin/jobs", "jobs", "Executive Lounge Receptionist", true],
            ["/b2b-admin/analytics", "analytics", "채용 운영 분석", false],
          ];

          for (const [route, shot, expectedText, exact] of routes) {
            await page.goto(`${BASE_URL}${route}`, { waitUntil: "domcontentloaded" });
            await page.getByText(expectedText, { exact }).first().waitFor({ state: "visible", timeout: 20000 });
            await page.waitForTimeout(500);
            await noHorizontalOverflow(page, `${viewportName}:B2B:${route}`);
            await capture(page, `${viewportName.toLowerCase()}-b2b-${shot}`);
          }
'''
          if old_routes not in s:
              raise SystemExit('B2B_ROUTE_BLOCK_NOT_FOUND')
          s = s.replace(old_routes, new_routes, 1)
          p.write_text(s)
          PY
      - name: Start production build
        shell: bash
        run: |
          npm start > /tmp/the-lobby-internal-visual.log 2>&1 &
          echo $! > /tmp/the-lobby-internal-visual.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              echo INTERNAL_VISUAL_SERVER_READY
              exit 0
            fi
            sleep 1
          done
          cat /tmp/the-lobby-internal-visual.log
          exit 1
      - name: Run authenticated Candidate and B2B journeys
        env:
          NODE_PATH: /tmp/the-lobby-playwright/node_modules
        run: node tests/authenticated-ui-qa.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-authenticated-final-screenshots
          path: authenticated-ui-qa-artifacts/*.png
          retention-days: 1
          if-no-files-found: warn
      - name: Server diagnostics
        if: failure()
        run: tail -n 250 /tmp/the-lobby-internal-visual.log || true
      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/the-lobby-internal-visual.pid ]; then
            kill "$(cat /tmp/the-lobby-internal-visual.pid)" || true
          fi
