name: Patch authenticated UI QA fixture

on:
  push:
    branches: [ops/authenticated-ui-qa]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[org-fixture-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/authenticated-ui-qa
          fetch-depth: 0
      - name: Add isolated organization fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/authenticated-ui-qa.cjs')
          s = p.read_text()
          old = 'async function seed() {\n  const [candidateUser, recruiterUser] = await Promise.all(['
          new = '''async function seed() {\n  await db.collection("organizations").doc(orgId).set({\n    organizationId: orgId,\n    name: "UI QA 격리 조직",\n    displayName: "UI QA 격리 조직",\n    status: "ACTIVE",\n    createdAt: FieldValue.serverTimestamp(),\n    updatedAt: FieldValue.serverTimestamp(),\n  });\n\n  const [candidateUser, recruiterUser] = await Promise.all(['''
          if old not in s:
              raise SystemExit('SEED_TARGET_NOT_FOUND')
          s = s.replace(old, new, 1)
          old2 = '  for (const jobId of created.jobIds) batchDeletes.push(db.collection("jobs").doc(jobId));\n  for (const uid of created.authUids) {'
          new2 = '  for (const jobId of created.jobIds) batchDeletes.push(db.collection("jobs").doc(jobId));\n  batchDeletes.push(db.collection("organizations").doc(orgId));\n  for (const uid of created.authUids) {'
          if old2 not in s:
              raise SystemExit('CLEANUP_TARGET_NOT_FOUND')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Remove patch workflow and commit
        run: |
          rm .github/workflows/patch-authenticated-ui-qa.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/authenticated-ui-qa.cjs .github/workflows/patch-authenticated-ui-qa.yml
          git commit -m "Fix authenticated UI QA organization fixture [org-fixture-done]"
          git push origin HEAD:ops/authenticated-ui-qa
