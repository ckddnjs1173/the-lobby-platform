name: Responsive Browser QA

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: browser-qa-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: browser-qa.example.invalid
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: the-lobby-platform
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: browser-qa.example.invalid
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:browserqa
      GROQ_API_KEY: browser-qa-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium
        run: |
          npm install --prefix /tmp/the-lobby-playwright --no-package-lock playwright@1.55.0
          /tmp/the-lobby-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Start app
        run: |
          npm start > /tmp/the-lobby-browser-qa.log 2>&1 &
          echo $! > /tmp/the-lobby-browser-qa.pid
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/the-lobby-browser-qa.log
          exit 1
      - name: Browser journeys
        env:
          NODE_PATH: /tmp/the-lobby-playwright/node_modules
        run: node tests/release-browser-qa.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-browser-qa-screenshots-v2
          path: browser-qa-artifacts/*.png
          retention-days: 1
      - if: failure()
        run: tail -n 200 /tmp/the-lobby-browser-qa.log || true
      - if: always()
        run: |
          if [ -f /tmp/the-lobby-browser-qa.pid ]; then kill "$(cat /tmp/the-lobby-browser-qa.pid)" || true; fi
