name: Responsive Browser QA

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: browser-qa-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: browser-qa.example.invalid
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: the-lobby-platform
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: browser-qa.example.invalid
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:browserqa
      GROQ_API_KEY: browser-qa-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Start application
        shell: bash
        run: |
          npm start > /tmp/the-lobby-browser-qa.log 2>&1 &
          echo $! > /tmp/the-lobby-browser-qa.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              echo "BROWSER_QA_SERVER_READY"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/the-lobby-browser-qa.log
          exit 1

      - name: Desktop and mobile browser journeys
        run: node tests/release-browser-qa.cjs

      - name: Browser server diagnostics
        if: failure()
        run: tail -n 200 /tmp/the-lobby-browser-qa.log || true

      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/the-lobby-browser-qa.pid ]; then
            kill "$(cat /tmp/the-lobby-browser-qa.pid)" || true
          fi
