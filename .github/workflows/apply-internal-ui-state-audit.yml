name: Apply Internal UI State Audit

on:
  push:
    branches:
      - ops/internal-ui-state-audit-20260826
    paths:
      - scripts/apply-internal-ui-state-audit.py
      - .github/workflows/apply-internal-ui-state-audit.yml

permissions:
  contents: write

jobs:
  apply-product-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve transformer and lock product head
        shell: bash
        run: |
          cp scripts/apply-internal-ui-state-audit.py /tmp/apply-internal-ui-state-audit.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply-internal-ui-state-audit.py')
          text = path.read_text(encoding='utf-8')
          old = "replace_once(path, 'mt-0.5 truncate text-[10px]', 'mt-0.5 truncate text-[11px]')"
          new = '''replace_once(
              path,
              '            <div className={`mt-0.5 truncate text-[10px] ${item.active ? "text-white/65" : "text-brand-muted"}`}>{item.caption}</div>',
              '            <div className={`mt-0.5 truncate text-[11px] ${item.active ? "text-white/70" : "text-brand-muted"}`}>{item.caption}</div>',
          )'''
          if text.count(old) != 1:
              raise SystemExit('TEMP_TRANSFORMER_CAPTION_PATCH_MISMATCH')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git fetch origin agent/launch-pool-foundation
          actual="$(git rev-parse origin/agent/launch-pool-foundation)"
          expected="155e864658e77b81dd357f02017bf2371d4d41df"
          if [ "$actual" != "$expected" ]; then
            echo "PRODUCT_HEAD_MOVED expected=$expected actual=$actual"
            exit 1
          fi
          git checkout -B agent/launch-pool-foundation origin/agent/launch-pool-foundation

      - name: Transform and statically verify product
        shell: bash
        run: |
          python /tmp/apply-internal-ui-state-audit.py
          git diff --check
          node tests/p1-product-ux-check.cjs
          git diff --stat

      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "UX: harden candidate and admin states"
          git push origin HEAD:agent/launch-pool-foundation
